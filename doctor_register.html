<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Registration - MindMate Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7; 
            --primary-hover: #0369a1;
            --surface: #ffffff;
            --background: #f0f9ff;
            --text-dark: #0f172a;
            --text-light: #64748b;
            --border: #e2e8f0;
        }
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .login-card {
            background: var(--surface);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 500px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 1.8rem;
            color: var(--primary);
            margin: 0 0 5px 0;
        }
        .header p {
            color: var(--text-light);
            margin: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.95rem;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: var(--primary);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: var(--primary-hover);
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            color: var(--primary);
        }
        .error-msg {
            color: #ef4444;
            font-size: 0.9rem;
            margin-top: -10px;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="header">
            <h1 data-i18n="doc_reg_title">👨‍⚕️ Doctor Registration</h1>
            <p data-i18n="doc_reg_desc">Create your secure medical account</p>
        </div>
        
        <form id="doctor-reg-form">
            <div class="form-group">
                <label for="name" data-i18n="full_name">Full Name</label>
                <input type="text" id="name" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="email" data-i18n="email_addr">Email Address</label>
                <input type="email" id="email" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="specialization" data-i18n="specialization">Specialization</label>
                <input type="text" id="specialization" class="form-control" placeholder="e.g. Psychiatrist" required>
            </div>
            
            <div class="form-group">
                <label for="password" data-i18n="password">Password</label>
                <input type="password" id="password" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="confirm-password" data-i18n="confirm_password">Confirm Password</label>
                <input type="password" id="confirm-password" class="form-control" required>
            </div>

            <p id="error-msg" class="error-msg"></p>
            
            <button type="submit" class="btn-submit" data-i18n="register_btn">Register Account</button>
        </form>

        <a href="/doctor_login" class="back-link" data-i18n="back_to_login">← Back to Login</a>
    </div>

    <script src="/static/i18n.js"></script>
    <script>
        document.getElementById('doctor-reg-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const spec = document.getElementById('specialization').value;
            const pwd = document.getElementById('password').value;
            const confirmPwd = document.getElementById('confirm-password').value;
            const err = document.getElementById('error-msg');

            if(pwd !== confirmPwd) {
                err.innerText = "Passwords do not match.";
                err.style.display = 'block';
                return;
            }

            const res = await fetch('/api/doctor/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, email, specialization: spec, password: pwd })
            });
            const data = await res.json();
            
            if (data.success) {
                alert("Registration successful! Please login.");
                window.location.href = '/doctor_login';
            } else {
                err.innerText = data.message;
                err.style.display = 'block';
            }
        });
    </script>
</body>
</html>
